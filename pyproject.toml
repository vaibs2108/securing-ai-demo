[project]
name = "securing-ai-demo"
version = "0.1.0"
description = "Securing AI — Agentic AI Security Showcase (NIST CSF lifecycle demo)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-community>=0.2",
    "langgraph>=0.2",
    "openai>=1.35",
    "tiktoken>=0.7",
    "faiss-cpu>=1.8",
    "langsmith>=0.1",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "PyMuPDF>=1.24",
    "chardet>=5.2",
    "python-docx>=1.1",
    "mcp>=1.0",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "tenacity>=8.3",
    "cachetools>=5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
